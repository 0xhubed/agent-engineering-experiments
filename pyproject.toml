[project]
name = "aex"
version = "0.1.0"
description = "Reproducible experiments behind agent-engineering.ch"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  "jsonschema>=4.23",
  "docling>=2.40",
]

[dependency-groups]
dev = ["pytest>=8", "reportlab>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs network or model downloads (deselect with -m 'not slow')"]
addopts = "-m 'not slow'"
